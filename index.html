<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lastutec</title>
  <meta name="description" content="Lastutec">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Ctext x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='64' font-weight='900' text-anchor='middle' fill='%23f5a623'%3EL%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0e0e0e;
      --fg: #f4f4f4;
      --accent: #f5a623;
      --alarm: #ff3b30;
      color-scheme: dark;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(90vw, 1400px);
    }
    .logo {
      width: 100%;
      height: auto;
    }
    .bar {
      width: 100%;
      height: auto;
      margin-top: -4%;
      overflow: visible;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .bar.dragging { cursor: grabbing; }
    .bar .support { fill: var(--fg); }
    .bar .beam {
      fill: none;
      stroke: var(--accent);
      stroke-width: 22;
      stroke-linecap: round;
    }
    .bar text {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 22px;
      fill: var(--fg);
    }
    .bar .scale line { stroke: var(--fg); stroke-width: 2; }
    .bar .scale .limit line { stroke: var(--alarm); stroke-width: 4; }
    .bar .scale .limit text { fill: var(--alarm); font-weight: 700; }
    .bar .limit-line {
      stroke: var(--alarm);
      stroke-width: 2;
      stroke-dasharray: 8 8;
      opacity: .5;
    }
    .bar .marker { fill: var(--accent); }
    .bar .readout { font-size: 26px; font-weight: 700; }
    .bar.over .beam { stroke: var(--alarm); }
    .bar.over .marker, .bar.over .readout { fill: var(--alarm); }
    .alarm {
      margin-top: 1.5vw;
      padding: .4em 1em;
      border-radius: 6px;
      background: var(--alarm);
      color: #fff;
      font: 700 clamp(14px, 2vw, 24px) 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: .04em;
      visibility: hidden;
    }
    .alarm.on {
      visibility: visible;
      animation: blink .5s steps(2, start) infinite;
    }
    @keyframes blink { to { opacity: .35; } }
    .logo .word { fill: var(--fg); }
    .logo .accent { fill: var(--accent); }
  </style>
</head>
<body>
  <h1 style="position:absolute;left:-9999px">Lastutec</h1>
  <div class="stage">
  <svg class="logo" viewBox="0 0 1000 220" role="img" aria-label="Lastutec">
    <rect class="accent" x="0" y="20" width="36" height="180" rx="4"/>
    <text class="word" x="60" y="170"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-size="168" font-weight="900" letter-spacing="-4"
          textLength="930" lengthAdjust="spacingAndGlyphs">LASTUTEC</text>
  </svg>
  <svg class="bar" viewBox="-120 -100 1240 200" aria-label="Taivutettava palkki">
    <!-- Allowable midspan deflection L/300 (drawn 14× exaggerated) -->
    <line class="limit-line" x1="20" y1="45" x2="980" y2="45"/>
    <polygon class="support" points="20,11 -12,64 52,64"/>
    <polygon class="support" points="980,11 948,64 1012,64"/>
    <path class="beam" d="M 20 0 Q 500 0 980 0"/>
    <text class="readout" x="-24" y="-30" text-anchor="end">L/∞</text>
    <!-- Scale: y = 2 · deflection − 90, so L/300 lines up with the beam -->
    <g class="scale">
      <line x1="1040" y1="-90" x2="1040" y2="90"/>
      <g><line x1="1032" y1="-90" x2="1048" y2="-90"/><text x="1060" y="-83">0</text></g>
      <g><line x1="1032" y1="-63" x2="1048" y2="-63"/><text x="1060" y="-56">L/1000</text></g>
      <g><line x1="1032" y1="-36" x2="1048" y2="-36"/><text x="1060" y="-29">L/500</text></g>
      <g class="limit"><line x1="1028" y1="0" x2="1052" y2="0"/><text x="1060" y="7">L/300</text></g>
      <g><line x1="1032" y1="45" x2="1048" y2="45"/><text x="1060" y="52">L/200</text></g>
      <g><line x1="1032" y1="90" x2="1048" y2="90"/><text x="1060" y="97">L/150</text></g>
      <polygon class="marker" points="1028,0 1012,-9 1012,9"/>
    </g>
  </svg>
  <div class="alarm" role="alert">⚠ TAIVUMA YLITTÄÄ L/300</div>
  </div>
  <script>
    (() => {
      const svg = document.querySelector('.bar');
      const path = svg.querySelector('.beam');
      const marker = svg.querySelector('.marker');
      const readout = svg.querySelector('.readout');
      const alarm = document.querySelector('.alarm');
      const A = 20, B = 980, LIMIT = 90;
      // Drawn deflection is exaggerated: span 960 / (bend / 14.0625) → L/n = 13500 / bend.
      const RATIO = 13500, ALLOWED = RATIO / 300;
      let bend = 0, vel = 0, dragging = false, raf = 0, over = false, audio = null;

      const clamp = (v, m) => Math.max(-m, Math.min(m, v));

      const beep = () => {
        try {
          audio ??= new (window.AudioContext || window.webkitAudioContext)();
          const osc = audio.createOscillator(), gain = audio.createGain();
          osc.type = 'square';
          osc.frequency.value = 880;
          gain.gain.value = 0.08;
          osc.connect(gain).connect(audio.destination);
          osc.start();
          osc.stop(audio.currentTime + 0.15);
        } catch {}
        navigator.vibrate?.(120);
      };

      // Quadratic Bézier: the curve's midpoint is half the control point's offset.
      const draw = () => {
        path.setAttribute('d', `M ${A} 0 Q 500 ${bend * 2} ${B} 0`);
        const d = Math.abs(bend);
        marker.setAttribute('transform', `translate(0 ${2 * Math.min(d, LIMIT) - 90})`);
        const n = d < 0.5 ? '∞' : Math.round(RATIO / d);
        readout.textContent = `L/${n}`;
        const nowOver = d > ALLOWED;
        if (nowOver !== over) {
          over = nowOver;
          svg.classList.toggle('over', over);
          alarm.classList.toggle('on', over);
          if (over && dragging) beep();
        }
      };

      const toSvgY = e => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse()).y;
      };

      // Damped spring back to straight after release.
      const spring = () => {
        vel = (vel - bend * 0.12) * 0.86;
        bend += vel;
        draw();
        if (Math.abs(bend) > 0.05 || Math.abs(vel) > 0.05) raf = requestAnimationFrame(spring);
        else { bend = vel = 0; draw(); }
      };

      svg.addEventListener('pointerdown', e => {
        dragging = true;
        cancelAnimationFrame(raf);
        vel = 0;
        svg.setPointerCapture(e.pointerId);
        svg.classList.add('dragging');
        bend = clamp(toSvgY(e), LIMIT);
        draw();
      });
      svg.addEventListener('pointermove', e => {
        if (!dragging) return;
        bend = clamp(toSvgY(e), LIMIT);
        draw();
      });
      const release = () => {
        if (!dragging) return;
        dragging = false;
        svg.classList.remove('dragging');
        raf = requestAnimationFrame(spring);
      };
      svg.addEventListener('pointerup', release);
      svg.addEventListener('pointercancel', release);
    })();
  </script>
</body>
</html>
