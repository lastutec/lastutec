<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lastutec</title>
  <meta name="description" content="Lastutec">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Ctext x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='64' font-weight='900' text-anchor='middle' fill='%23f5a623'%3EL%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0e0e0e;
      --fg: #f4f4f4;
      --accent: #f5a623;
      --alarm: #ff3b30;
      color-scheme: dark;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(90vw, 1400px);
    }
    .logo {
      width: 100%;
      height: auto;
    }
    .bar {
      width: 100%;
      height: auto;
      margin-top: -4%;
      overflow: visible;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .bar.dragging { cursor: grabbing; }
    .bar .support { fill: var(--fg); }
    .bar .beam {
      fill: none;
      stroke: var(--accent);
      stroke-width: 22;
      stroke-linecap: round;
    }
    .bar text {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 22px;
      fill: var(--fg);
    }
    .bar .limit-line {
      stroke: var(--alarm);
      stroke-width: 2;
      stroke-dasharray: 8 8;
      opacity: .5;
    }
    .gauge .face { fill: #1b1b1b; stroke: #333; stroke-width: 3; }
    .gauge .dial { fill: none; stroke: var(--fg); stroke-width: 3; }
    .gauge .redzone { fill: none; stroke: var(--alarm); stroke-width: 9; }
    .gauge .tick { stroke: var(--fg); stroke-width: 3; }
    .gauge .tick.minor { stroke-width: 1.5; opacity: .6; }
    .gauge .label {
      font-size: 15px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .gauge .label.limit { fill: var(--alarm); }
    .gauge .needle {
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
    }
    .gauge .hub { fill: var(--fg); }
    .gauge .readout {
      font-size: 22px;
      font-weight: 700;
      text-anchor: middle;
    }
    .bar.over .beam, .bar.over .needle { stroke: var(--alarm); }
    .bar.over .readout { fill: var(--alarm); }
    .alarm {
      margin-top: 2.5vw;
      padding: .4em 1em;
      border-radius: 6px;
      background: var(--alarm);
      color: #fff;
      font: 700 clamp(14px, 2vw, 24px) 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: .04em;
      visibility: hidden;
    }
    .alarm.on {
      visibility: visible;
      animation: blink .5s steps(2, start) infinite;
    }
    @keyframes blink { to { opacity: .35; } }
    .logo .word { fill: var(--fg); }
    .logo .accent { fill: var(--accent); }
  </style>
</head>
<body>
  <h1 style="position:absolute;left:-9999px">Lastutec</h1>
  <div class="stage">
  <svg class="logo" viewBox="0 0 1000 220" role="img" aria-label="Lastutec">
    <rect class="accent" x="0" y="20" width="36" height="180" rx="4"/>
    <text class="word" x="60" y="170"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-size="168" font-weight="900" letter-spacing="-4"
          textLength="930" lengthAdjust="spacingAndGlyphs">LASTUTEC</text>
  </svg>
  <svg class="bar" viewBox="-15 -100 1245 200" aria-label="Taivutettava palkki">
    <!-- Allowable midspan deflection L/300 (drawn 14× exaggerated) -->
    <line class="limit-line" x1="20" y1="45" x2="980" y2="45"/>
    <polygon class="support" points="20,11 -12,64 52,64"/>
    <polygon class="support" points="980,11 948,64 1012,64"/>
    <path class="beam" d="M 20 0 Q 500 0 980 0"/>
    <g class="gauge">
      <circle class="face" cx="1135" cy="5" r="104"/>
      <path class="dial"/>
      <path class="redzone"/>
      <g class="ticks"></g>
      <text class="readout" x="1135" y="62">L/1000</text>
      <line class="needle" x1="1135" y1="5" x2="1135" y2="-77"/>
      <circle class="hub" cx="1135" cy="5" r="8"/>
    </g>
  </svg>
  <div class="alarm" role="alert">⚠ TAIVUMA YLITTÄÄ L/300</div>
  </div>
  <script>
    (() => {
      const svg = document.querySelector('.bar');
      const path = svg.querySelector('.beam');
      const needle = svg.querySelector('.needle');
      const readout = svg.querySelector('.readout');
      const alarm = document.querySelector('.alarm');
      const A = 20, B = 980, LIMIT = 90;
      // Drawn deflection is exaggerated: span 960 / (bend / 14.0625) → L/n = 13500 / bend.
      const RATIO = 13500, ALLOWED = RATIO / 300;
      let bend = 0, vel = 0, dragging = false, raf = 0, over = false, audio = null;

      const clamp = (v, m) => Math.max(-m, Math.min(m, v));

      // Speedometer-style gauge: evenly spaced L/n ticks, needle rests at L/1000.
      const G = { cx: 1135, cy: 5, r: 92 };
      const TICKS = [1000, 500, 400, 300, 200];
      const A0 = -120, STEP = 52.5, A_MAX = 120;
      const STOPS = [...TICKS.map((n, i) => [RATIO / n, A0 + i * STEP]), [LIMIT, A_MAX]];
      const polar = (deg, r) => {
        const a = deg * Math.PI / 180;
        return [G.cx + r * Math.sin(a), G.cy - r * Math.cos(a)];
      };
      const arc = (from, to, r) => {
        const [x0, y0] = polar(from, r), [x1, y1] = polar(to, r);
        return `M ${x0} ${y0} A ${r} ${r} 0 ${to - from > 180 ? 1 : 0} 1 ${x1} ${y1}`;
      };
      const angleOf = d => {
        if (d <= STOPS[0][0]) return A0;
        for (let i = 1; i < STOPS.length; i++) {
          const [d0, a0] = STOPS[i - 1], [d1, a1] = STOPS[i];
          if (d <= d1) return a0 + (a1 - a0) * (d - d0) / (d1 - d0);
        }
        return A_MAX;
      };

      const limitAngle = A0 + TICKS.indexOf(300) * STEP;
      svg.querySelector('.dial').setAttribute('d', arc(A0, limitAngle, G.r));
      svg.querySelector('.redzone').setAttribute('d', arc(limitAngle, A_MAX, G.r - 3));
      const ticks = svg.querySelector('.ticks');
      const el = (tag, attrs, text) => {
        const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const k in attrs) node.setAttribute(k, attrs[k]);
        if (text) node.textContent = text;
        return ticks.appendChild(node);
      };
      for (let a = A0; a <= A_MAX; a += STEP / 2) {
        const major = (a - A0) % STEP === 0 && a <= A0 + (TICKS.length - 1) * STEP;
        const [x1, y1] = polar(a, G.r), [x2, y2] = polar(a, G.r - (major ? 16 : 8));
        el('line', { class: major ? 'tick' : 'tick minor', x1, y1, x2, y2 });
        if (major) {
          const n = TICKS[(a - A0) / STEP];
          const [x, y] = polar(a, G.r - 40);
          el('text', { class: n === 300 ? 'label limit' : 'label', x, y }, `L/${n}`);
        }
      }

      const beep = () => {
        try {
          audio ??= new (window.AudioContext || window.webkitAudioContext)();
          const osc = audio.createOscillator(), gain = audio.createGain();
          osc.type = 'square';
          osc.frequency.value = 880;
          gain.gain.value = 0.08;
          osc.connect(gain).connect(audio.destination);
          osc.start();
          osc.stop(audio.currentTime + 0.15);
        } catch {}
        navigator.vibrate?.(120);
      };

      // Quadratic Bézier: the curve's midpoint is half the control point's offset.
      const draw = () => {
        path.setAttribute('d', `M ${A} 0 Q 500 ${bend * 2} ${B} 0`);
        const d = Math.abs(bend);
        needle.setAttribute('transform', `rotate(${angleOf(d)} ${G.cx} ${G.cy})`);
        readout.textContent = `L/${Math.min(1000, Math.round(RATIO / Math.max(d, 1)))}`;
        const nowOver = d > ALLOWED;
        if (nowOver !== over) {
          over = nowOver;
          svg.classList.toggle('over', over);
          alarm.classList.toggle('on', over);
          if (over && dragging) beep();
        }
      };

      const toSvgY = e => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse()).y;
      };

      // Damped spring back to straight after release.
      const spring = () => {
        vel = (vel - bend * 0.12) * 0.86;
        bend += vel;
        draw();
        if (Math.abs(bend) > 0.05 || Math.abs(vel) > 0.05) raf = requestAnimationFrame(spring);
        else { bend = vel = 0; draw(); }
      };

      svg.addEventListener('pointerdown', e => {
        dragging = true;
        cancelAnimationFrame(raf);
        vel = 0;
        svg.setPointerCapture(e.pointerId);
        svg.classList.add('dragging');
        bend = clamp(toSvgY(e), LIMIT);
        draw();
      });
      svg.addEventListener('pointermove', e => {
        if (!dragging) return;
        bend = clamp(toSvgY(e), LIMIT);
        draw();
      });
      const release = () => {
        if (!dragging) return;
        dragging = false;
        svg.classList.remove('dragging');
        raf = requestAnimationFrame(spring);
      };
      svg.addEventListener('pointerup', release);
      svg.addEventListener('pointercancel', release);
    })();
  </script>
</body>
</html>
