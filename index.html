<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lastutec</title>
  <meta name="description" content="Lastutec – konstruktöörin työkaluja tulossa.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ecebe8;
      --text: #3d3f42;
      --shadow: rgba(0, 0, 0, .28);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17191b; --text: #b9bcc0; --shadow: rgba(0, 0, 0, .7); color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main { width: 100%; max-width: 1100px; text-align: center; }
    .logo { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 14px var(--shadow)); }
    .logo text { font-family: "Archivo Black", "Arial Black", Impact, sans-serif; font-size: 230px; letter-spacing: -6px; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    p { margin: 8px 0 0; font-size: clamp(1.05rem, 3.2vw, 1.75rem); font-weight: 500; letter-spacing: .02em; }
  </style>
</head>
<body>
  <main>
    <h1>Lastutec</h1>
    <svg class="logo" viewBox="0 0 1100 300" role="img" aria-label="Lastutec">
      <defs>
        <filter id="concrete" x="-2%" y="-5%" width="104%" height="110%" color-interpolation-filters="sRGB">
          <!-- Hienojakoinen pintakarheus valaistuna -->
          <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="4" result="grain"/>
          <feDiffuseLighting in="grain" surfaceScale="1.4" lighting-color="#cfccc6" result="lit">
            <feDistantLight azimuth="235" elevation="58"/>
          </feDiffuseLighting>
          <!-- Laajat sävyvaihtelut (valun laikut) -->
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="11" result="blotch"/>
          <feColorMatrix in="blotch" type="matrix" values="0 0 0 0 .78  0 0 0 0 .77  0 0 0 0 .75  .9 0 0 0 0" result="blotchTone"/>
          <feBlend in="lit" in2="blotchTone" mode="multiply" result="tone"/>
          <!-- Ilmahuokoset -->
          <feTurbulence type="fractalNoise" baseFrequency="0.32" numOctaves="1" seed="21" result="pits"/>
          <feColorMatrix in="pits" type="matrix" values="0 0 0 0 .38  0 0 0 0 .37  0 0 0 0 .36  -45 0 0 0 14.2" result="pitMask"/>
          <feComposite in="pitMask" in2="tone" operator="over" result="pitted"/>
          <feComposite in="pitted" in2="SourceAlpha" operator="in" result="textured"/>
          <!-- Viistetty reuna -->
          <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="soft"/>
          <feSpecularLighting in="soft" surfaceScale="5" specularConstant=".55" specularExponent="14" lighting-color="#ffffff" result="spec">
            <feDistantLight azimuth="235" elevation="35"/>
          </feSpecularLighting>
          <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
          <feComposite in="textured" in2="specIn" operator="arithmetic" k2="1" k3=".7"/>
        </filter>
      </defs>
      <text x="550" y="228" text-anchor="middle" fill="#9a9894" filter="url(#concrete)">lastutec</text>
    </svg>
    <p>Konstruktöörin työkaluja tulossa…</p>
  </main>
</body>
</html>
