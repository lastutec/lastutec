<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lastutec</title>
  <meta name="description" content="Lastutec">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Ctext x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='64' font-weight='900' text-anchor='middle' fill='%23f5a623'%3EL%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0e0e0e;
      --fg: #f4f4f4;
      --accent: #f5a623;
      color-scheme: dark;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(90vw, 1400px);
    }
    .logo {
      width: 100%;
      height: auto;
    }
    .bar {
      width: 100%;
      height: auto;
      margin-top: -6%;
      overflow: visible;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .bar.dragging { cursor: grabbing; }
    .bar .support { fill: var(--fg); }
    .bar path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 22;
      stroke-linecap: round;
    }
    .logo .word { fill: var(--fg); }
    .logo .accent { fill: var(--accent); }
  </style>
</head>
<body>
  <h1 style="position:absolute;left:-9999px">Lastutec</h1>
  <div class="stage">
  <svg class="logo" viewBox="0 0 1000 220" role="img" aria-label="Lastutec">
    <rect class="accent" x="0" y="20" width="36" height="180" rx="4"/>
    <text class="word" x="60" y="170"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-size="168" font-weight="900" letter-spacing="-4"
          textLength="930" lengthAdjust="spacingAndGlyphs">LASTUTEC</text>
  </svg>
  <svg class="bar" viewBox="0 -100 1000 200" aria-label="Taivutettava palkki">
    <polygon class="support" points="20,11 -12,64 52,64"/>
    <polygon class="support" points="980,11 948,64 1012,64"/>
    <path d="M 20 0 Q 500 0 980 0"/>
  </svg>
  </div>
  <script>
    (() => {
      const svg = document.querySelector('.bar');
      const path = svg.querySelector('path');
      const A = 20, B = 980, LIMIT = 90;
      let bend = 0, vel = 0, dragging = false, raf = 0;

      const clamp = (v, m) => Math.max(-m, Math.min(m, v));

      // Quadratic Bézier: the curve's midpoint is half the control point's offset.
      const draw = () => path.setAttribute('d', `M ${A} 0 Q 500 ${bend * 2} ${B} 0`);

      const toSvgY = e => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse()).y;
      };

      // Damped spring back to straight after release.
      const spring = () => {
        vel = (vel - bend * 0.12) * 0.86;
        bend += vel;
        draw();
        if (Math.abs(bend) > 0.05 || Math.abs(vel) > 0.05) raf = requestAnimationFrame(spring);
        else { bend = vel = 0; draw(); }
      };

      svg.addEventListener('pointerdown', e => {
        dragging = true;
        cancelAnimationFrame(raf);
        vel = 0;
        svg.setPointerCapture(e.pointerId);
        svg.classList.add('dragging');
        bend = clamp(toSvgY(e), LIMIT);
        draw();
      });
      svg.addEventListener('pointermove', e => {
        if (!dragging) return;
        bend = clamp(toSvgY(e), LIMIT);
        draw();
      });
      const release = () => {
        if (!dragging) return;
        dragging = false;
        svg.classList.remove('dragging');
        raf = requestAnimationFrame(spring);
      };
      svg.addEventListener('pointerup', release);
      svg.addEventListener('pointercancel', release);
    })();
  </script>
</body>
</html>
