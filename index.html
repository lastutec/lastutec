<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lastutec</title>
  <meta name="description" content="Lastutec">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Ctext x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='64' font-weight='900' text-anchor='middle' fill='%23F74902'%3EL%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #000000;
      --fg: #f4f4f4;
      --accent: #F74902;
      color-scheme: dark;
    }
    html, body {
      min-height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(90vw, 1400px);
    }
    .logo {
      width: 100%;
      height: auto;
    }
    .bar {
      width: 100%;
      height: auto;
      margin-top: -6%;
      overflow: visible;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .bar.dragging { cursor: grabbing; }
    .bar .support { fill: var(--fg); }
    .bar path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 22;
      stroke-linecap: round;
    }
    .topics {
      list-style: none;
      margin: 3rem 0 2rem;
      padding: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .topics li {
      border-left: 6px solid var(--accent);
      background: #141414;
      padding: 1.1rem 1.25rem;
      border-radius: 4px;
    }
    .topics h2 {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .topics .tx > span {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #8a8a8a;
    }
    .topics .row, .topics li.live a { display: flex; align-items: center; gap: 14px; }
    .topics .ic { flex: none; width: 44px; height: 44px; display: block; }
    .topics .ic svg { width: 100%; height: 100%; display: block; }
    .topics .tx { display: block; min-width: 0; }
    .topics .tx > span { display: block; }
    .topics li.live { background: #2a1105; }
    .topics li.live a { color: inherit; text-decoration: none; }
    .topics li.live .tx > span { color: var(--accent); }
    .topics li.live:hover { background: #3a1606; }
    .topics li.live a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 2px; }
    .logo .word { fill: var(--fg); }
    .logo .accent { fill: var(--accent); }
  </style>
</head>
<body>
  <h1 style="position:absolute;left:-9999px">Lastutec</h1>
  <div class="stage">
  <svg class="logo" viewBox="0 0 1000 220" role="img" aria-label="Lastutec">
    <rect class="accent" x="0" y="20" width="36" height="180" rx="4"/>
    <text class="word" x="60" y="170"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-size="168" font-weight="900" letter-spacing="-4"
          textLength="930" lengthAdjust="spacingAndGlyphs">LASTUTEC</text>
  </svg>
  <svg class="bar" viewBox="0 -100 1000 200" aria-label="Taivutettava palkki">
    <polygon class="support" points="20,11 -12,64 52,64"/>
    <polygon class="support" points="980,11 948,64 1012,64"/>
    <path d="M 20 0 Q 500 0 980 0"/>
  </svg>
  <ul class="topics" aria-label="Tulevat työkalut">
    <li><div class="row"><span class="ic"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="9" width="20" height="7" rx="2" fill="var(--accent)"/><rect x="16" y="20.5" width="22" height="7" rx="2" fill="#8a8a8a"/><rect x="24" y="32" width="18" height="7" rx="2" fill="#5a5a5a"/><line x1="4" y1="5" x2="4" y2="43" stroke="var(--fg)" stroke-width="2"/></svg></span><span class="tx"><h2>Projektinhallinta</h2><span>Tulossa</span></span></div></li>
    <li class="live"><a href="statiikka/"><span class="ic"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="19" width="42" height="5" fill="var(--accent)"/><polygon points="8,24 2,34 14,34" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linejoin="round"/><line x1="0" y1="37" x2="16" y2="37" stroke="var(--fg)" stroke-width="2"/><polygon points="40,24 34,34 46,34" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="37" cy="37.5" r="1.8" fill="var(--fg)"/><circle cx="43" cy="37.5" r="1.8" fill="var(--fg)"/></svg></span><span class="tx"><h2>Statiikka ja mekaniikka</h2><span>Avaa työkalut →</span></span></a></li>
    <li class="live"><a href="betoni/"><span class="ic"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="8" width="36" height="32" rx="1.5" fill="#8f8f8f"/><circle cx="14" cy="16" r="1.4" fill="#6f6f6f"/><circle cx="31" cy="13" r="1" fill="#6f6f6f"/><circle cx="24" cy="27" r="1.6" fill="#6f6f6f"/><circle cx="35" cy="33" r="1.2" fill="#6f6f6f"/><circle cx="12" cy="34" r="1" fill="#6f6f6f"/></svg></span><span class="tx"><h2>Betonirakenteet</h2><span>Avaa työkalut →</span></span></a></li>
    <li><div class="row"><span class="ic"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 6h32v6H27v24h13v6H8v-6h13V12H8z" fill="#b9c0c6"/></svg></span><span class="tx"><h2>Teräsrakenteet</h2><span>Tulossa</span></span></div></li>
    <li><div class="row"><span class="ic"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#9a6a3a"/><circle cx="24" cy="24" r="19" fill="none" stroke="#6b4423" stroke-width="2.5"/><circle cx="24.5" cy="24.5" r="13" fill="none" stroke="#c99a62" stroke-width="1.6"/><circle cx="24" cy="25" r="8" fill="none" stroke="#c99a62" stroke-width="1.4"/><circle cx="24.5" cy="24.5" r="3" fill="#c99a62"/></svg></span><span class="tx"><h2>Puurakenteet</h2><span>Tulossa</span></span></div></li>
  </ul>
  </div>
  <script>
    (() => {
      const svg = document.querySelector('.bar');
      const path = svg.querySelector('path');
      const A = 20, B = 980, LIMIT = 90;
      let bend = 0, vel = 0, dragging = false, raf = 0;

      const clamp = (v, m) => Math.max(-m, Math.min(m, v));

      // Quadratic Bézier: the curve's midpoint is half the control point's offset.
      const draw = () => path.setAttribute('d', `M ${A} 0 Q 500 ${bend * 2} ${B} 0`);

      const toSvgY = e => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse()).y;
      };

      // Damped spring back to straight after release.
      const spring = () => {
        vel = (vel - bend * 0.12) * 0.86;
        bend += vel;
        draw();
        if (Math.abs(bend) > 0.05 || Math.abs(vel) > 0.05) raf = requestAnimationFrame(spring);
        else { bend = vel = 0; draw(); }
      };

      svg.addEventListener('pointerdown', e => {
        dragging = true;
        cancelAnimationFrame(raf);
        vel = 0;
        svg.setPointerCapture(e.pointerId);
        svg.classList.add('dragging');
        bend = clamp(toSvgY(e), LIMIT);
        draw();
      });
      svg.addEventListener('pointermove', e => {
        if (!dragging) return;
        bend = clamp(toSvgY(e), LIMIT);
        draw();
      });
      const release = () => {
        if (!dragging) return;
        dragging = false;
        svg.classList.remove('dragging');
        raf = requestAnimationFrame(spring);
      };
      svg.addEventListener('pointerup', release);
      svg.addEventListener('pointercancel', release);
    })();
  </script>
</body>
</html>
